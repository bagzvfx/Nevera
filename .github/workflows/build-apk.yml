name: Build Nevera Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nevera-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Test, Build & Release Nevera APK (Phone)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      - name: Setup Release Keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > nevera-release.jks
            {
              echo "storeFile=nevera-release.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testProdDebugUnitTest --stacktrace

      - name: Build Nevera Prod Debug APK
        run: ./gradlew assembleProdDebug --stacktrace

      - name: Build Nevera Prod Release APK (Signed)
        if: steps.keystore.outputs.has_keystore == 'true'
        run: ./gradlew assembleProdRelease --stacktrace

      - name: Prepare Versioned Release APKs
        id: version
        run: |
          VER=$(grep 'bitchordVersionName' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            SRC_DIR="app/build/outputs/apk/prod/release"
          else
            SRC_DIR="app/build/outputs/apk/prod/debug"
          fi
          ARM64=$(ls "$SRC_DIR"/*arm64-v8a*.apk | head -n 1)
          UNIV=$(ls "$SRC_DIR"/*universal*.apk | head -n 1)
          cp "$ARM64" "release-assets/Nevera-v${VER}-arm64.apk"
          cp "$UNIV" "release-assets/Nevera-v${VER}-universal.apk"
          ls -lh release-assets/

      - name: Upload Nevera APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nevera-v${{ steps.version.outputs.version }}-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish Public GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Nevera v${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            ## Nevera v${{ steps.version.outputs.version }}

            - **Borderless Floating Karaoke Overlay**: Lirik overlay transparan tanpa kotak/bingkai, lengkap dengan karaoke sweep 60fps, efek gelombang per huruf, glow Reff, & auto-Romaji.
            - **Beat-Synced Bass & Treble Glow**: Efek cahaya bass/treble kini selaras ritme speaker (~185ms latency compensation + beat-onset spectral flux) dan jauh lebih terlihat.
            - **Karaoke Wave + Reff / Best Part Climax**: Animasi gelombang halus tiap huruf mengikuti waktu lirik + aura spesial saat masuk Reff / Best Part.
            - **Share Animated Karaoke Lyrics Video**: Bagikan video MP4 lirik dengan efek sweep & gelombang karaoke yang sama seperti playback.
            - **Studio Mastering Volume Maximizer**: RMS upward maximizer + hardware AudioFlinger boost hingga +15 dB dengan soft-knee limiter bersih tanpa pecah.
            - **UI/UX Lebih Ringan, Halus & Presisi**: Perbaikan grid & alignment bar, animasi draw-phase 0-recomposition.

            **Pilih APK:**
            - `Nevera-v${{ steps.version.outputs.version }}-arm64.apk` (Direkomendasikan untuk mayoritas HP Android modern, lebih ringan)
            - `Nevera-v${{ steps.version.outputs.version }}-universal.apk` (Semua arsitektur CPU)
          files: |
            release-assets/Nevera-v${{ steps.version.outputs.version }}-arm64.apk
            release-assets/Nevera-v${{ steps.version.outputs.version }}-universal.apk

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/
